<!DOCTYPE html>
<html>
<body>

<h2>Array Example</h2>

<button onclick="showArray()">Show Array</button>

<p id="demo"></p>

<script>
function showArray() {
    let fruits = ["Apple", "Mango", "Banana", "Orange"];
    document.getElementById("demo").innerHTML = fruits.join(", ");
}
</script>

</body>
</html>
