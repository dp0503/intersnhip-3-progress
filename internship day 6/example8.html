<!DOCTYPE html>
<html>
<body>

<h2>Variables, Loops and Conditions</h2>

<p id="demo"></p>

<script>
let text = "";

for(let i=1; i<=10; i++) {

    if(i % 2 == 0)
        text += i + " is Even<br>";
    else
        text += i + " is Odd<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</body>
</html>
