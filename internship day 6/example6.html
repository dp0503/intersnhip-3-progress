<!DOCTYPE html>
<html>
<body>

<h2>Numbers 1 to 100</h2>

<table border="1" id="tbl"></table>

<script>
let output = "";

for(let i=1; i<=100; i++) {

    if((i-1)%10==0)
        output += "<tr>";

    output += "<td>" + i + "</td>";

    if(i%10==0)
        output += "</tr>";
}

document.getElementById("tbl").innerHTML = output;
</script>

</body>
</html>
